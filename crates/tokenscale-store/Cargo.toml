[package]
name        = "tokenscale-store"
description = "SQLite schema, migrations, and query layer for tokenscale (sqlx, compile-time-verified)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
tokenscale-core.workspace = true
sqlx.workspace            = true
chrono.workspace          = true
thiserror.workspace       = true
serde.workspace           = true
# v0.1.17 / Phase 1.5: query primitives extract per-tool fields
# (Bash `command`, Edit `file_path`, …) from the tool_uses.input_json
# column on demand. Caller-side parsing keeps the schema simple.
serde_json.workspace      = true
tracing.workspace         = true
tokio.workspace           = true
# Used by billing::synthesize_external_id to dedup CSV rows that have
# no Stripe-side stable identifier.
sha2.workspace            = true
hex.workspace             = true
# v0.1.18 / Phase 2: commit extraction needs regex (primary SHA
# capture, push-refspec fallback) and shlex (token-walk filter for
# real `git commit` invocations vs meta-mentions). See
# docs/roadmap-2-commit-attribution.md § 1.1 for why the LIKE
# filter alone overcounts by 4.7x.
regex.workspace           = true
shlex.workspace           = true
