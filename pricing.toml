# Haiku 5.5 is priced by prompt length on the live page: 0.10/0.50 for prompts
# up to 100,000 tokens and 0.50/2.50 above that (cache read 0.01 and 0.05).
# tokenscale's pricing schema has one rate per (model, valid_from); this row
# carries the under-100k tier, which covers the overwhelming majority of
# Claude Code requests. Tier-aware pricing (we record per-event input tokens,
# so it is implementable) is tracked as a filed issue; until then, events with
# prompts over 100k tokens on this model are underpriced by 5x. Labeled here
