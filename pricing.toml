# tokenscale — pricing factors
# Schema version: 1
#
# This file mirrors the structure of `environmental-factors.toml`. It carries
# Anthropic's published per-model API list pricing, which the application uses
# for two things:
#
#   1. The dashboard's "Billable tokens" view, which weights each token type
#      by its API price relative to input and stacks the weighted total.
#   2. The Phase 2 counterfactual-cost computation — "what would these tokens
#      have cost at API rates" — answering the value-of-subscription question.
#
# ============================================================================
# PRODUCTION rates. Every row below was verified against Anthropic's published
# pricing on 2026-05-18 at:
#
#     https://platform.claude.com/docs/en/about-claude/pricing
#     https://platform.claude.com/docs/en/about-claude/models/overview
#
# v0.1.11 corrected three rows that had carried wrong seed values since v0.1.0:
# Opus 4.7 (15/75 → 5/25), Opus 4.6 (15/75 → 5/25), Haiku 4.5 (0.80/4.00 →
# 1.00/5.00). Root cause was an "Opus pricing assumed unchanged from Opus 4
# family" assumption that was wrong from the 4.5 generation onward. See
# docs/cost-methodology.md for the dated correction entry.
#
# v0.1.13 introduces multi-row format (array-of-tables per model) and
# time-anchored `valid_from` dates. Each model now lives as
# `[[providers.<provider>.models."<id>"]]` so a future rate correction
# adds an additional row rather than overwriting history. Per-row
# `launch_date_source` carries the URL or rationale backing the date —
# sourced dates (Opus 4.7, Haiku 4.5) and conservative-estimate dates
# (Opus 4.6, Sonnet 4.6) are distinguished in the field text so a future
# reader can tell them apart from the file alone. See
# docs/roadmap-cost-time-anchoring.md for the design and
# docs/cost-methodology.md for the v0.1.13 corrections-log entry.
#
# DO NOT seed new rows with assumed values cascaded from another model. Every
# row gets verified against Anthropic's published rate card or it does not
# land here. The startup gate (PricingFile::has_seed_markers + is_review_pending)
# refuses to serve when this rule is violated.
#
# Re-verify all rows against Anthropic's pricing pages quarterly, OR whenever
# the drift-detector workflow (when v0.1.x adds it) reports divergence.
# ============================================================================

schema_version = 1
file_status    = "production"
file_version   = "1.1"
file_published = "2026-06-16"
# v1.1 (2026-06-16): added claude-opus-4-8 and claude-fable-5 rows. While
# sourcing those, the full rate card was re-verified against the pricing
# page on 2026-06-16; every pre-existing row is unchanged. Fable 5 carries
# `status = "retired"` (pulled by a US export-control directive 2026-06-12,
# ~3 days after its 2026-06-09 launch); the row is kept for historical
# attribution and the drift detector treats its absence from the live page
# as expected. See docs/roadmap-model-additions-fable-opus48.md.

# ----------------------------------------------------------------------------
# [[providers.<provider>.models.<model-id>]]   — array-of-tables form
# ----------------------------------------------------------------------------
# Each model entry is an array; v0.1.13 ships one row per model. Future
# rate corrections add a NEW row with a later `valid_from` rather than
# overwriting the existing one — that's the time-anchoring guarantee.
#
# Each row carries:
#   * `input_usd_per_mtok`        — fresh input tokens, USD per million.
#   * `output_usd_per_mtok`       — output tokens, USD per million.
#   * `cache_read_usd_per_mtok`   — replayed cached input tokens (typically
#                                    10% of input price for Anthropic).
#   * `cache_write_5m_multiplier` — 5-minute prompt-cache write tokens, as
#                                    a multiplier on the input price (typically 1.25x).
#   * `cache_write_1h_multiplier` — 1-hour prompt-cache write tokens, as
#                                    a multiplier on the input price (typically 2.0x).
#   * `valid_from`                 — ISO date these prices became effective
#                                    (the model's launch date or the date
#                                    Anthropic published a rate change).
#   * `launch_date_source`         — URL or rationale backing the date.
#                                    Sourced rows cite primary then secondary
#                                    URLs; conservative-estimate rows say so
#                                    explicitly per D3 in the time-anchoring
#                                    roadmap.
#   * `source_url` / `source_accessed_at` — rate-card provenance.
#
# ----------------------------------------------------------------------------

[providers.anthropic]
display_name = "Anthropic"

# ---- Fable models ----
# Fable 5 was Anthropic's most expensive GA model (2x Opus). Launched
# 2026-06-09; disabled 2026-06-12 by a US-government export-control
# directive (pulled alongside Mythos 5), about three days after launch.
# The row is retained for historical attribution of usage during its live
# window. `status = "retired"` is TOML-only provenance (ignored by the Rust
# parser, same as launch_date_source) that tells the pricing-drift detector
# to treat absence from the live pricing page as expected, not as drift.

[[providers.anthropic.models."claude-fable-5"]]
display_name              = "Claude Fable 5"
valid_from                = "2026-06-09"
status                    = "retired"
input_usd_per_mtok        = 10.00
output_usd_per_mtok       = 50.00
cache_read_usd_per_mtok   = 1.00
cache_write_5m_multiplier = 1.25
cache_write_1h_multiplier = 2.00
source_url                = "https://platform.claude.com/docs/en/about-claude/pricing"
source_accessed_at        = "2026-06-16"
launch_date_source        = "https://www.anthropic.com/news/claude-fable-5-mythos-5 (Anthropic launch announcement, 2026-06-09); disabled 2026-06-12 per https://www.infoq.com/news/2026/06/claude-5-release/ and https://thenewstack.io/us-gov-orders-anthropic-to-pull-fable-5-and-mythos-5-three-days-after-launch/. Sourced, exact launch date; D3 conservative-dating rule does not apply."

