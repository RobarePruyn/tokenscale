# tokenscale — pricing factors
# Schema version: 1
#
# This file mirrors the structure of `environmental-factors.toml`. It carries
# Anthropic's published per-model API list pricing, which the application uses
# for two things:
#
#   1. The dashboard's "Billable tokens" view, which weights each token type
#      by its API price relative to input and stacks the weighted total.
#   2. The Phase 2 counterfactual-cost computation — "what would these tokens
#      have cost at API rates" — answering the value-of-subscription question.
#
# ============================================================================
# PRODUCTION rates. Every row below was verified against Anthropic's published
# pricing on 2026-05-18 at:
#
#     https://platform.claude.com/docs/en/about-claude/pricing
#     https://platform.claude.com/docs/en/about-claude/models/overview
#
# v0.1.11 corrected three rows that had carried wrong seed values since v0.1.0:
# Opus 4.7 (15/75 → 5/25), Opus 4.6 (15/75 → 5/25), Haiku 4.5 (0.80/4.00 →
# 1.00/5.00). Root cause was an "Opus pricing assumed unchanged from Opus 4
# family" assumption that was wrong from the 4.5 generation onward. See
# docs/cost-methodology.md for the dated correction entry.
#
# v0.1.13 introduces multi-row format (array-of-tables per model) and
# time-anchored `valid_from` dates. Each model now lives as
# `[[providers.<provider>.models."<id>"]]` so a future rate correction
# adds an additional row rather than overwriting history. Per-row
# `launch_date_source` carries the URL or rationale backing the date —
# sourced dates (Opus 4.7, Haiku 4.5) and conservative-estimate dates
# (Opus 4.6, Sonnet 4.6) are distinguished in the field text so a future
# reader can tell them apart from the file alone. See
# docs/roadmap-cost-time-anchoring.md for the design and
# docs/cost-methodology.md for the v0.1.13 corrections-log entry.
#
# DO NOT seed new rows with assumed values cascaded from another model. Every
# row gets verified against Anthropic's published rate card or it does not
# land here. The startup gate (PricingFile::has_seed_markers + is_review_pending)
# refuses to serve when this rule is violated.
#
# Re-verify all rows against Anthropic's pricing pages quarterly, OR whenever
# the drift-detector workflow (when v0.1.x adds it) reports divergence.
# ============================================================================

schema_version = 1
file_status    = "production"
file_version   = "1.3"
file_published = "2026-10-07"
# v1.2 (2026-08-02): full model coverage, every Anthropic model ever
# released, plus the D1 alias table. Every rate below traces to a source
# named in launch_date_source; rows labeled ESTIMATE in notes say so and why.
# Sources used for this version (all accessed 2026-08-02 unless noted):
#   - live pricing page: https://platform.claude.com/docs/en/about-claude/pricing
#   - Anthropic Model Pricing PDF (Claude Instant / 2.0 / 2.1):
#     https://www-cdn.anthropic.com/90df03aed08b794ab03c5a7bf28b2ad9cf26cf3c/model_pricing_july2023.pdf
#     (the CDN path may rotate; a July 2023 snapshot also lives at
#     https://www-cdn.anthropic.com/31021aea87c30ccaecbd2e966e49a03834bfd1d2/pricing.pdf)
#   - launch posts: claude-3-family, claude-3-5-sonnet, 3-5-models-and-computer-use,
#     claude-3-7-sonnet (anthropic.com/news), plus dated launch coverage for the
#     4.6 through 5 generations (TechCrunch, Axios, Simon Willison)
#   - lifecycle: https://platform.claude.com/docs/en/about-claude/model-deprecations
# Two genuine mid-life price changes exist in the whole history and are
# expressed as second valid_from rows: Claude 3.5 Haiku (2024-12-03) and
# Claude Sonnet 5 (2026-09-01, pre-announced intro window).
# See docs/roadmap-full-model-coverage.md for the design pass.

# ----------------------------------------------------------------------------
# [[providers.<provider>.models.<model-id>]]   (array-of-tables form)
# ----------------------------------------------------------------------------
# Each model entry is an array. Rate corrections and pre-announced changes
# add a NEW row with a later valid_from rather than overwriting the old one;
# that is the time-anchoring guarantee.
#
# Row keys are the model IDs real data emits (D1): dated pinned snapshots
# for models before the 4.6 generation, dateless IDs from 4.6 on. Undated
# convenience names and -latest pointers live in the aliases table below.
#
# Each row carries:
#   * input_usd_per_mtok / output_usd_per_mtok
#   * cache_read_usd_per_mtok        (0.1x input for every era with caching)
#   * cache_write_5m_multiplier / cache_write_1h_multiplier  (1.25x / 2.0x)
#   * valid_from                     (ISO date the rate took effect)
#   * launch_date_source             (URL or rationale backing the date)
#   * source_url / source_accessed_at (rate-card provenance)
#   * notes (optional)               (ESTIMATE labels and caveats)
# Prompt caching launched in beta on 2024-08-14. Rows for models that
# predate it (Claude 1.x, Instant, 2.x, and the Claude 3 family at launch)
# carry the standard multipliers NOMINALLY (D3): no cache tokens can exist
# for those eras, so the nominal values multiply zero and never surface a
# dollar. They satisfy the schema; they are not a claim that the price
# existed.
# ----------------------------------------------------------------------------

[providers.anthropic]
display_name = "Anthropic"

# ----------------------------------------------------------------------------
# D1 alias table: raw emitted or convenience ID -> canonical row key.
# ----------------------------------------------------------------------------
# Per Anthropic's model-ID docs, pre-4.6 undated names are convenience
# pointers to the most recent dated snapshot for that minor version; the
# -latest names were the same idea for the 3.x generation. Real emitted
# usage carries the dated form (empirically confirmed in the maintainer
# corpus), so these mappings are a safety net, not the primary key path.
# An alias key must never also be a model row key (startup gate).
[providers.anthropic.aliases]
"claude-haiku-4-5"          = "claude-haiku-4-5-20251001"
"claude-sonnet-4-5"         = "claude-sonnet-4-5-20250929"
